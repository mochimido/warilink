# 注意: このワークフローは GitHub 上ではまだ実行・検証していない(2026-10-20 時点。ローカルで同じコマンドを実行して確認)。
# DB はジョブごとの使い捨てサービスコンテナ(ジョブ終了で破棄)。テスト側も DB 名・ホストを検査し、
# 使い捨て DB 以外では downgrade / TRUNCATE / E2E を行わずに失敗する(apps/api/tests/api/conftest.py, playwright.config.ts)。
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチ・PR の古い実行は取り消す(結果は最新の実行で判定する)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: warilink, POSTGRES_PASSWORD: warilink-dev-only, POSTGRES_DB: warilink_test }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U warilink" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      # 傾き補正のテストが日本語の合成レシート画像を作るため、日本語フォントを入れる
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: python -m venv .venv && .venv/bin/pip install uv==0.13.1
      # ワーカーのテスト(固定アダプター)が OpenCV を使うため OCR の依存も入れる。実モデルのテストは -m 'not ocr' で除外
      - run: cd apps/api && UV_PROJECT_ENVIRONMENT=../../.venv ../../.venv/bin/uv sync --frozen --group ocr
      - run: cd apps/api && ../../.venv/bin/ruff check app tests && ../../.venv/bin/mypy
      - run: cd apps/api && ../../.venv/bin/pytest
        env:
          WARILINK_DATABASE_URL: postgresql+psycopg://warilink:warilink-dev-only@localhost:55432/warilink_test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:typecheck && pnpm web:build

  # 重いジョブ: 本物の PaddleOCR(CPU)を使う結合テストと、モバイル・デスクトップの E2E(実 API・実 DB・実ワーカー)。
  # E2E は精算・権限・OCR(合成レシート)・アクセシビリティの主要導線を含む。失敗は再試行で隠さない(retries: 0)
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [api, web]
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: warilink, POSTGRES_PASSWORD: warilink-dev-only, POSTGRES_DB: warilink_e2e }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U warilink" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql+psycopg://warilink:warilink-dev-only@localhost:55432/warilink_e2e
      WARILINK_OCR_CPU_THREADS: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - uses: pnpm/action-setup@v5
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      # 合成レシートの描画用の日本語フォント(OFL-1.1)と OpenCV の実行時ライブラリ
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk libgl1 libglib2.0-0
      - run: python -m venv .venv && .venv/bin/pip install uv==0.13.1
      - run: cd apps/api && UV_PROJECT_ENVIRONMENT=../../.venv ../../.venv/bin/uv sync --frozen --group ocr
      - name: PaddleOCR models cache (公式配布元から初回取得、名前で固定)
        uses: actions/cache@v5
        with:
          path: ~/.paddlex/official_models
          key: paddlex-models-PP-OCRv6_medium-${{ hashFiles('apps/api/uv.lock') }}
      - name: Real OCR integration (pytest -m ocr)
        run: cd apps/api && PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True ../../.venv/bin/pytest -m ocr
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @warilink/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
