# 注意: このワークフローは GitHub 上ではまだ実行・検証していない(リモート未設定)。
name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: warilink, POSTGRES_PASSWORD: warilink-dev-only, POSTGRES_DB: warilink_test }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U warilink" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m venv .venv && .venv/bin/pip install uv==0.13.1
      - run: cd apps/api && UV_PROJECT_ENVIRONMENT=../../.venv ../../.venv/bin/uv sync --frozen --group ocr
      - run: cd apps/api && ../../.venv/bin/ruff check app tests && ../../.venv/bin/mypy && ../../.venv/bin/pytest
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:typecheck && pnpm web:build
