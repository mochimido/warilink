[project]
name = "warilink-api"
version = "0.1.0"
description = "WariLink API (FastAPI) — 金額計算・精算の正本"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.20",
  "pillow>=11",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]
# OCR ワーカー専用(API コンテナには入れない)。paddlepaddle は公式配布元から取得する
ocr = [
  "paddlepaddle==3.3.1",
  "paddleocr==3.7.0",
]

[[tool.uv.index]]
name = "paddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[tool.uv.sources]
paddlepaddle = { index = "paddle" }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not ocr'"
markers = [
  "db: requires PostgreSQL",
  "ocr: requires PaddleOCR (uv sync --group ocr); run with `make test-ocr`",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true
files = ["app/domain", "app/ocr/parser.py"]
